{% extends "base.html" %}
{% block content %}
<div class="row">
    <div class="col-md-3 col-lg-2 mb-3">
        <div class="list-group shadow-sm">
            <a href="{{ url_for('inmate.list_inmates') }}"
               class="list-group-item list-group-item-action
                      {{ 'active' if request.endpoint == 'inmate.list_inmates' }}">
                <i class="bi bi-list-ul"></i> All Inmates
            </a>
            <a href="{{ url_for('inmate.intake_scan') }}"
               class="list-group-item list-group-item-action
                      {{ 'active' if request.endpoint == 'inmate.intake_scan' }}">
                <i class="bi bi-fingerprint"></i> New Intake
            </a>
        </div>
    </div>
    <div class="col-md-9 col-lg-10">
        {% block inmate_content %}{% endblock %}
    </div>
</div>
{% endblock %}
