{% extends "base.html" %}
{% block content %}
<div class="row">
    <div class="col-md-3 col-lg-2 mb-3">
        <div class="list-group shadow-sm">
            <a href="{{ url_for('visitor.list_visitors') }}"
               class="list-group-item list-group-item-action
                      {{ 'active' if request.endpoint == 'visitor.list_visitors' }}">
                <i class="bi bi-people"></i> All Visitors
            </a>
            <a href="{{ url_for('visitor.scan') }}"
               class="list-group-item list-group-item-action
                      {{ 'active' if request.endpoint == 'visitor.scan' }}">
                <i class="bi bi-fingerprint"></i> Gate Scan
            </a>
        </div>
    </div>
    <div class="col-md-9 col-lg-10">
        {% block visitor_content %}{% endblock %}
    </div>
</div>
{% endblock %}
